[project]
name = "siterecipesapi"
version = "0.1.0"
description = ""
authors = [{ name = "Dmitriy Levykin", email = "dmlegasy@gmail.com" }]
requires-python = ">=3.12,<4"

dependencies = [
    "fastapi>=0.136.1,<0.137",
    "uvicorn>=0.46.0,<0.47",
    "dotenv>=0.9.9,<0.10",
    "pydantic[email]>=2.13.4,<3",
    "sqlalchemy>=2.0.41,<3",
    "aiosqlite>=0.22.1,<0.23",
    "pydantic-settings>=2.13.1,<3",
    "alembic>=1.18.4,<2",
    "structlog>=25.5.0,<26",
    "python-json-logger>=4.1.0,<5",
    "uvloop>=0.22.1,<0.23",
    "fastapi-csrf-protect>=1.0.7,<2",
    "bcrypt>=5.0.0,<6",
    "redis>=7.4.0,<8",
    "asyncpg>=0.31.0,<0.32",
    "uvicorn-worker>=0.4.0",
    "httptools>=0.7.1",
    "gunicorn>=26.0.0",
    "fastapi-pagination>=0.15.14",
    "sqlakeyset>=2.0.1775222100",
]

[dependency-groups]
dev = [
    "faker>=40.21.0",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.10,<0.16",
]

[tool.uv]
package = false
default-groups = "all"

[build-system]
requires = ["uv_build>=0.9.11,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py314"
line-length = 88
exclude = [
    ".git",
    "__pycache__",
    "migrations",
    "venv",
    ".venv",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "DJ",
    "UP",
]
ignore = ["E501"]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.isort]
known-first-party = ["src"]
combine-as-imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope="session"
testpaths = ["tests"]

addopts = [
    "-v",
]
