[tool.poetry]
name = "siterecipesapi"
version = "0.1.0"
description = ""
authors = ["Dmitriy Levykin <dmlegasy@gmail.com>"]


[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.136.1"
uvicorn = "^0.46.0"
dotenv = "^0.9.9"
pydantic = "^2.11.7"
sqlalchemy = "^2.0.41"
aiosqlite = "^0.22.1"
pydantic-settings = "^2.13.1"
alembic = "^1.18.4"
structlog = "^25.5.0"
python-json-logger = "^4.1.0"
uvloop = "^0.22.1"
fastapi-csrf-protect = "^1.0.7"


[tool.ruff]
target-version = "py314"
line-length = 88
exclude = [
    ".git",
    "__pycache__",
    "migrations",
    "venv",
    ".venv",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "DJ",
    "UP",
    "TCH",
]
ignore = ["E501"]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.isort]
known-first-party = ["src"]
combine-as-imports = true


[tool.poetry.group.dev.dependencies]
ruff = "^0.15.10"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
